  <script>
    (()=>{
      const root=document.getElementById('camp-mobile-proposals');
      const zones={backpack:{name:'リュック類',en:'BAGS',x:14.8,y:33.3},lantern:{name:'ランタン',en:'LIGHTING',x:32.8,y:30.2},cookware:{name:'クッカー',en:'COOKWARE',x:49.5,y:32.8},tools:{name:'工具・ロープ',en:'TOOLS',x:75,y:29},coolers:{name:'クーラー',en:'COOLERS',x:79.8,y:65},boxes:{name:'収納BOX',en:'STORAGE',x:39.1,y:69.5},clothes:{name:'衣類',en:'CLOTHING',x:88.6,y:33.3},sleeping:{name:'寝具・テント',en:'SLEEP & SHELTER',x:58,y:68},tableware:{name:'食器',en:'TABLEWARE',x:40,y:38}};
      const saved=window.openai?.widgetState?.privateContent||{};
      const state={photoHeight:Number(saved.photoHeight)||142,panOffset:Number.isFinite(saved.panOffset)?saved.panOffset:230,focusZoom:Number(saved.focusZoom)||260,zone:zones[saved.zone]?saved.zone:'lantern'};
      const catalogue=root.querySelector('#camp-photo-catalogue');
      const panorama=root.querySelector('#camp-pan-canvas');
      const photo=root.querySelector('#camp-focus-photo');
      const choices=root.querySelector('#camp-focus-choices');
      function positionCrops(){
        root.querySelectorAll('.scene-crop').forEach(crop=>{
          const frame=crop.parentElement,w=frame.clientWidth,h=frame.clientHeight;if(!w||!h)return;
          const zoom=parseFloat(getComputedStyle(crop).getPropertyValue('--crop-zoom'))||400;
          const fullWidth=w*zoom/100,fullHeight=fullWidth*992/1586;
          const x=Math.abs(parseFloat(crop.style.getPropertyValue('--crop-x')))/100;
          const y=Math.abs(parseFloat(crop.style.getPropertyValue('--crop-y')))/100;
          crop.style.left=Math.min(0,Math.max(w-fullWidth,w/2-fullWidth*x))+'px';
          crop.style.top=Math.min(0,Math.max(h-fullHeight,h/2-fullHeight*y))+'px';
          crop.style.transform='none';
        });
      }
      function render(){
        catalogue.style.setProperty('--catalogue-photo-height',state.photoHeight+'px');
        panorama.style.transform='translateX(-'+state.panOffset+'px)';
        photo.style.setProperty('--crop-zoom',state.focusZoom+'%');
        const zone=zones[state.zone],crop=photo.querySelector('.scene-crop');
        crop.style.setProperty('--crop-x',-zone.x+'%');crop.style.setProperty('--crop-y',-zone.y+'%');
        photo.setAttribute('aria-label',zone.name+'の収納を大きく表示');
        photo.querySelector('.focus-plaque strong').textContent=zone.name;
        photo.querySelector('.focus-plaque small').textContent=zone.en;
        choices.querySelectorAll('[data-zone]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.zone===state.zone)));
        positionCrops();
      }
      function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mobileHomeDesign:{zone:state.zone,photoHeight:state.photoHeight,panOffset:state.panOffset,focusZoom:state.focusZoom}},privateContent:{...state}}).catch(()=>{});}
      choices.addEventListener('click',event=>{const button=event.target.closest('[data-zone]');if(!button)return;state.zone=button.dataset.zone;render();remember();});
      render();
      const cropObserver=new ResizeObserver(positionCrops);
      root.querySelectorAll('.zone-photo,.focus-photo').forEach(frame=>cropObserver.observe(frame));
      window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(!next)return;if(zones[next.zone])state.zone=next.zone;['photoHeight','panOffset','focusZoom'].forEach(key=>{if(Number.isFinite(next[key]))state[key]=next[key];});render();});
      if(globalThis.Tweak){
        const cardsTweak=new Tweak({container:catalogue,onChange:()=>{render();remember();}});
        cardsTweak.addSlider(state,'photoHeight',{label:'カードの写真の高さ',min:120,max:190,step:10,unit:'px'});
        const shelfTweak=new Tweak({container:panorama,onChange:()=>{render();remember();}});
        shelfTweak.addSlider(state,'panOffset',{label:'棚の見せる位置',min:0,max:480,step:10,unit:'px'});
        const focusTweak=new Tweak({container:photo,onChange:()=>{render();remember();}});
        focusTweak.addSlider(state,'focusZoom',{label:'収納写真の拡大率',min:240,max:340,step:10,unit:'%'});
      }
    })();
  </script>
</div>
